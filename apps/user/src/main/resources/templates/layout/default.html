<!DOCTYPE html>
<html th:fragment="layout(title, header, content, scripts)" lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:replace="${title}">User</title>
    <link th:href="@{/webjars/tabler__core/1.4.0/dist/css/tabler.min.css}" rel="stylesheet">
    <link th:href="@{/webjars/tabler__core/1.4.0/dist/css/tabler-vendors.min.css}" rel="stylesheet">
</head>
<body class="layout-fluid">
    <div class="page">
        <!-- Top navbar -->
        <header class="navbar navbar-expand-md d-print-none" data-bs-theme="dark">
            <div class="container-xl">
                <button class="navbar-toggler" type="button"
                        data-bs-toggle="collapse" data-bs-target="#navbar-menu"
                        aria-controls="navbar-menu" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <h1 class="navbar-brand navbar-brand-autodark d-none-navbar-horizontal pe-0 pe-md-3">
                    <a th:href="@{/}">
                        <span class="text-white fs-3 fw-bold">User</span>
                    </a>
                </h1>
                <div class="collapse navbar-collapse" id="navbar-menu">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/}">
                                <span class="nav-link-title">홈</span>
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </header>

        <!-- Page wrapper -->
        <div class="page-wrapper">
            <!-- Page header -->
            <div class="page-header d-print-none">
                <th:block th:replace="${header}" />
            </div>

            <!-- Page body -->
            <div class="page-body">
                <div class="container-xl">
                    <th:block th:replace="${content}" />
                </div>
            </div>

            <!-- Footer -->
            <footer class="footer footer-transparent d-print-none">
                <div class="container-xl">
                    <div class="text-muted text-center">
                        Powered by
                        <a href="https://tabler.io" target="_blank" rel="noopener" class="link-secondary">Tabler</a>.
                    </div>
                </div>
            </footer>
        </div>
    </div>

    <script th:src="@{/webjars/tabler__core/1.4.0/dist/js/tabler.min.js}"></script>
    <script th:src="@{/webjars/htmx.org/2.0.7/dist/htmx.min.js}"></script>
    <th:block th:replace="${scripts}" />
</body>
</html>
